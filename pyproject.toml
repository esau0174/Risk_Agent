[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskflow-agent"
version = "0.1.0"
description = "Agentic risk workflow demo with market risk, credit risk, commentary, tracing, and validation guardrails."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "yfinance",
    "python-dotenv",
    "openai",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
ui = [
    "streamlit>=1.30",
]

[project.scripts]
riskflow-agent = "riskflow_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "riskflow_agent", "riskflow_agent.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
